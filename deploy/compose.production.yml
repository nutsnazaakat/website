services:
  api:
    build:
      context: ..
      target: api
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4400
      TRUST_PROXY_HOPS: 2
      DB_MIGRATIONS_RUN: "false"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4400/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  storefront:
    build:
      context: ..
      target: storefront
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  admin:
    build:
      context: ..
      target: admin
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
