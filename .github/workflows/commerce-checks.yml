name: Commerce checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test -w @nutwala/shared
      - run: npm run test -w @nutwala/api -- --runInBand
      - run: npm run test -w @nutwala/web
      - run: npm run test -w @nutwala/admin
